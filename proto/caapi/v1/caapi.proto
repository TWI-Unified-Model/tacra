syntax = "proto3";

package caapi.v1;
option go_package = "github.com/TWI-Unified-Model/twium/gen/go/caapi/v1;caapiv1";

enum CredentialAcquisitionMode {
    ACQUISITION_UNSPECIFIED = 0;
    ACQUISITION_ENROLL = 1;
    ACQUISITION_RETRIEVE = 2;
}

enum CredentialType {
    CREDENTIAL_TYPE_UNSPECIFIED = 0;

    // Bearer token credential types
    CREDENTIAL_TYPE_JWT = 1; // JSON Web Token
    CREDENTIAL_TYPE_PSK = 2; // Pre-shared Key
    CREDENTIAL_TYPE_API_KEY = 3; // API Key

    // Proof-of-possession credential types
    CREDENTIAL_TYPE_X509 = 1001; // PKIX Certificate
    CREDENTIAL_TYPE_WIC  = 1002; // WIMSE Workload Identity Certificate
    CREDENTIAL_TYPE_WIT = 1003; // WIMSE Workload Identity Token
}

message InitiateCredentialAcquistionRequest {
    // Which endpoint does the workload wish to authenticate to?
    string target = 1;

    // Which credential type does the workload with to use?
    CredentialType credential_type = 2;
}

message InitiateCredentialAcquisitionResponse {
    // Which credential acquisition mechanism
    // does the CAS support for this endpoint?
    CredentialAcquisitionMode mode = 1;

    // Optional challenge
    optional bytes challenge = 2;

    // TODO: research and add supported ciphers and other fields
}

message EnrollCredentialRequest {
    string target = 1;

    CredentialType credential_type = 2;

    // Optional credential hint
    optional string credential_hint = 3;

    // Workload Evidence including CSKpub
    bytes evidence = 4;

    // CSR for CSKpub
    bytes csr = 5;
}

message EnrollCredentialResponse {
    // TODO: explore utilizing existing types (protobuf representation of certificates etc.)
    bytes plaintext_credential = 1;
}

message RetrieveCredentialRequest {
    string target = 1;

    CredentialType credential_type = 2;

    // Optional credential hint
    optional string credential_hint = 3;

    // Workload Evidence including CEKpub
    bytes evidence = 4;

    // TODO: add CEKpub or is it implicit in Evidence?
}

message RetrieveCredentialResponse {
    bytes wrapped_credential = 1;
}

service CredentialAcquisitionService {
    rpc InitiateRemoteAttestation(InitiateCredentialAcquistionRequest) returns (InitiateCredentialAcquisitionResponse);

    rpc EnrollCredential(EnrollCredentialRequest) returns (EnrollCredentialResponse);

    rpc RetrieveCredential(RetrieveCredentialRequest) returns (RetrieveCredentialResponse);
}