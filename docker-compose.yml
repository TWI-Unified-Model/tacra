# Client + CAI sidecar. The sidecar owns platform + CAAPI; the client only
# calls AcquireCredential on the sidecar, then authenticates to the RUP.
#
# The demo RUP (tacra/server) is expected on the host by default:
#   ./deploy/init-local-rup-config.sh && ./bin/server
#   CAAPI_ADDR=<cas-client-host>:<port> docker compose up --build
#
# This repository has no CAAPI server: set CAAPI_ADDR to an external CAS
# client. Override CLIENT_SERVER if the RUP is elsewhere.

services:
  cai:
    build:
      context: .
      dockerfile: cai/Dockerfile
    environment:
      CAI_LISTEN: ":50051"
      CAAPI_ADDR: ${CAAPI_ADDR:-host.docker.internal:9090}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      - cai
    environment:
      CAI_ADDR: cai:50051
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:-localhost}
      RUP_CA_FILE: ${RUP_CA_FILE:-/etc/tacra-rup/rup-ca.pem}
    volumes:
      - ${RUP_CERTS_DIR:-./deploy/config/local/tacra-rup/certs}/rup-ca.pem:/etc/tacra-rup/rup-ca.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["${CLIENT_SERVER:-https://host.docker.internal:8443}"]
